    <script>
      try {
        const theme = localStorage.getItem('alpa:theme') === 'one-dark-pro' ? 'one-dark-pro' : 'light';
        document.documentElement.dataset.alpaTheme = theme;
        document.documentElement.classList.toggle('pf-v6-theme-dark', theme === 'one-dark-pro');
      } catch { document.documentElement.dataset.alpaTheme = 'light'; }
    </script>

    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>

openapi: 3.0.3
info:
  title: ALPA Inventory API
  version: 1.0.0
  description: API for maintaining workspaces, products, and components. Input strings are trimmed; programming language values are normalized to lowercase. Business validation returns domain error codes; JSON, length, and character validation returns invalid_request.
servers:
  - url: /
tags:
  - name: Workspaces
  - name: Products
  - name: Components
  - name: APIs
  - name: Clients
  - name: Integrations
paths:
  /v1/workspaces:
    post:
      tags: [Workspaces]
      summary: Create a workspace
      operationId: createWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateWorkspaceRequest'}
      responses:
        '201': {description: Workspace created, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Workspaces]
      summary: List workspaces
      operationId: listWorkspaces
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {description: Workspace page, content: {application/json: {schema: {$ref: '#/components/schemas/WorkspaceList'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/workspaces/{workspace_id}:
    parameters: [{$ref: '#/components/parameters/WorkspaceID'}]
    get:
      tags: [Workspaces]
      summary: Get a workspace
      operationId: getWorkspace
      responses:
        '200': {description: Workspace, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Workspaces]
      summary: Delete a workspace
      operationId: deleteWorkspace
      responses:
        '204': {description: Workspace deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/workspaces/{workspace_id}/products:
    parameters: [{$ref: '#/components/parameters/WorkspaceID'}]
    post:
      tags: [Products]
      summary: Create a product in a workspace
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProductRequest'}
      responses:
        '201': {description: Product created, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      tags: [Products]
      summary: List products in a workspace
      operationId: listWorkspaceProducts
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {description: Product page, content: {application/json: {schema: {$ref: '#/components/schemas/ProductList'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/products/{product_id}:
    parameters: [{$ref: '#/components/parameters/ProductID'}]
    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      responses:
        '200': {description: Product, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Products]
      summary: Delete a product
      operationId: deleteProduct
      responses:
        '204': {description: Product deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/components:
    post:
      tags: [Components]
      summary: Create a component
      operationId: createComponent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateComponentRequest'}
      responses:
        '201': {description: Component created, content: {application/json: {schema: {$ref: '#/components/schemas/Component'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ClientAlreadyExists'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/components/{component_id}/apis:
    parameters: [{$ref: '#/components/parameters/ParentComponentID'}]
    post:
      tags: [APIs]
      summary: Create a component API
      operationId: createComponentAPI
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAPIRequest'}
      responses:
        '201': {description: API created, content: {application/json: {schema: {$ref: '#/components/schemas/ComponentAPI'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/components/{component_id}/apis/{id}:
    parameters: [{$ref: '#/components/parameters/ParentComponentID'}, {$ref: '#/components/parameters/APIID'}]
    delete:
      tags: [APIs]
      summary: Delete a component API
      operationId: deleteComponentAPI
      responses:
        '204': {description: API deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [APIs]
      summary: Update a component API
      operationId: updateComponentAPI
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAPIRequest'}
      responses:
        '200': {description: API updated, content: {application/json: {schema: {$ref: '#/components/schemas/ComponentAPI'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/components/{component_id}/clients:
    parameters: [{$ref: '#/components/parameters/ParentComponentID'}]
    post:
      tags: [Clients]
      summary: Create a component client
      operationId: createComponentClient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateClientRequest'}
      responses:
        '201': {description: Client created, content: {application/json: {schema: {$ref: '#/components/schemas/ComponentClient'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ClientAlreadyExists'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/components/{component_id}/clients/{id}:
    parameters: [{$ref: '#/components/parameters/ParentComponentID'}, {$ref: '#/components/parameters/ClientID'}]
    delete:
      tags: [Clients]
      summary: Delete a component client
      operationId: deleteComponentClient
      responses:
        '204': {description: Client deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      tags: [Clients]
      summary: Update a component client
      operationId: updateComponentClient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateClientRequest'}
      responses:
        '200': {description: Client updated, content: {application/json: {schema: {$ref: '#/components/schemas/ComponentClient'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ClientAlreadyExists'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/integrations:
    post:
      tags: [Integrations]
      summary: Create an integration between a client and an API
      description: |
        Creates a directed integration from a component client to an API in another component of the same product.
        A client may have integrations with multiple APIs, but the same `client_id` and `api_id` pair may occur only once.
        The action must match the client communication type: request/response clients use `call`, event clients use
        `produce` or `consume`, and streaming clients use `listen-events`.
      operationId: createIntegration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIntegrationRequest'}
            examples:
              callAPI:
                summary: Call a synchronous API
                value: {client_id: 5001, api_id: 4001, action: call, description: Calls checkout with retries.}
              consumeEvents:
                summary: Consume events from an API
                value: {client_id: 5002, api_id: 4002, action: consume, description: Consumes order-created events.}
              listenToStream:
                summary: Listen to a streaming API without a description
                value: {client_id: 5003, api_id: 4003, action: listen-events}
      responses:
        '201': {description: Integration created, content: {application/json: {schema: {$ref: '#/components/schemas/Integration'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/integrations/{id}:
    parameters: [{$ref: '#/components/parameters/IntegrationID'}]
    patch:
      tags: [Integrations]
      summary: Update an integration description
      description: Updates only the description. Send `null` to clear the current description.
      operationId: updateIntegrationDescription
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateIntegrationDescriptionRequest'}
            examples:
              replaceDescription:
                summary: Replace the description
                value: {description: Calls checkout with retries.}
              clearDescription:
                summary: Clear the description
                value: {description: null}
      responses:
        '200': {description: Integration updated, content: {application/json: {schema: {$ref: '#/components/schemas/Integration'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Integrations]
      summary: Delete an integration
      description: Deletes only the integration; the client and API remain unchanged.
      operationId: deleteIntegration
      responses:
        '204': {description: Integration deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/components/{id}:
    parameters: [{$ref: '#/components/parameters/ComponentID'}]
    get:
      tags: [Components]
      summary: Get a component
      operationId: getComponent
      responses:
        '200': {description: Component, content: {application/json: {schema: {$ref: '#/components/schemas/Component'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    delete:
      tags: [Components]
      summary: Delete a component
      operationId: deleteComponent
      responses:
        '204': {description: Component deleted}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/products/{product_id}/components:
    parameters: [{$ref: '#/components/parameters/ProductID'}]
    get:
      tags: [Components]
      summary: List components in a product
      operationId: listProductComponents
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Offset'}]
      responses:
        '200': {description: Component page, content: {application/json: {schema: {$ref: '#/components/schemas/ComponentList'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  parameters:
    WorkspaceID: {name: workspace_id, in: path, required: true, schema: {allOf: [{$ref: '#/components/schemas/ID'}], example: 1001}}
    ProductID: {name: product_id, in: path, required: true, schema: {allOf: [{$ref: '#/components/schemas/ID'}], example: 2001}}
    ComponentID: {name: id, in: path, required: true, schema: {allOf: [{$ref: '#/components/schemas/ID'}], example: 3001}}
    ParentComponentID: {name: component_id, in: path, required: true, schema: {allOf: [{$ref: '#/components/schemas/ID'}], example: 3001}}
    APIID: {name: id, in: path, required: true, schema: {allOf: [{$ref: '#/components/schemas/ID'}], example: 4001}}
    ClientID: {name: id, in: path, required: true, schema: {allOf: [{$ref: '#/components/schemas/ID'}], example: 5001}}
    IntegrationID: {name: id, in: path, required: true, schema: {allOf: [{$ref: '#/components/schemas/ID'}], example: 6001}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20, example: 20}}
    Offset: {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0, example: 0}}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Resource not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflicting resource state, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ClientAlreadyExists: {description: A client with this type already exists for the component, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    InternalError: {description: Unexpected server error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    ID: {type: integer, format: int64, minimum: 1, example: 1001}
    ProductCode: {type: string, minLength: 1, maxLength: 10, pattern: "^[A-Z]+$", example: CHECKOUT}
    Name: {type: string, minLength: 1, maxLength: 50, example: Payments Platform}
    Description: {type: string, minLength: 1, maxLength: 1000, example: Processes card payments and refunds.}
    Pagination:
      type: object
      required: [limit, offset]
      properties:
        limit: {type: integer, minimum: 1, maximum: 100, example: 20}
        offset: {type: integer, minimum: 0, example: 0}
    Error:
      type: object
      required: [message, code, status]
      properties:
        message: {type: string, example: "name contains unsupported characters"}
        code: {type: string, description: "Business errors include unknown_language, unknown_technology_name, unknown_technology_type, too_many_endpoints, invalid_criticality, invalid_importancy, invalid_api_name, invalid_product_code, api_limit_exceeded, client_limit_exceeded, client_capabilities_too_large, client_already_exists, invalid_client_action, invalid_integration, integration_already_exists, and incompatible_client_integrations. Transport errors use invalid_request.", example: invalid_request}
        status: {type: integer, example: 400}
    Workspace:
      type: object
      required: [id, name]
      properties:
        id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 1001}
        name: {allOf: [{$ref: '#/components/schemas/Name'}], example: Payments Platform}
    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name: {allOf: [{$ref: '#/components/schemas/Name'}], example: Payments Platform}
    WorkspaceList:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Workspace'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    Criticality:
      type: string
      maxLength: 50
      enum: [mission-critical, business-critical, business-operational, office-productivity]
      example: business-critical
    Product:
      type: object
      required: [id, workspace_id, owning_team_id, product_code, name, criticality, description]
      properties:
        id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 2001}
        workspace_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 1001}
        owning_team_id: {allOf: [{$ref: '#/components/schemas/ID'}], nullable: true, example: 301}
        product_code: {allOf: [{$ref: '#/components/schemas/ProductCode'}], example: CHECKOUT}
        name: {allOf: [{$ref: '#/components/schemas/Name'}], example: Checkout Service}
        criticality: {$ref: '#/components/schemas/Criticality'}
        description: {allOf: [{$ref: '#/components/schemas/Description'}], nullable: true, example: Handles checkout and payment confirmation.}
    CreateProductRequest:
      type: object
      required: [product_code, name, criticality]
      properties:
        owning_team_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 301}
        product_code: {allOf: [{$ref: '#/components/schemas/ProductCode'}], example: CHECKOUT}
        name: {allOf: [{$ref: '#/components/schemas/Name'}], example: Checkout Service}
        criticality: {$ref: '#/components/schemas/Criticality'}
        description: {allOf: [{$ref: '#/components/schemas/Description'}], example: Handles checkout and payment confirmation.}
    ProductList:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Product'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    ComponentType:
      type: string
      maxLength: 50
      enum: [backend-service, frontend-service, infrastructure]
      example: backend-service
    BackendServiceDetails:
      type: object
      required: [language]
      properties:
        language: {$ref: '#/components/schemas/Language'}
        repository_url: {type: string, format: uri, maxLength: 2048, nullable: true, example: "https://github.com/example/backend"}
    FrontendServiceDetails:
      type: object
      required: [language]
      properties:
        language: {$ref: '#/components/schemas/Language'}
        language_version: {allOf: [{$ref: '#/components/schemas/Name'}], example: "1.27"}
        framework: {allOf: [{$ref: '#/components/schemas/Name'}], example: Gin}
    Language:
      type: string
      maxLength: 50
      enum: [c, c++, c#, go, java, javascript, typescript, python, ruby, php, rust, swift, kotlin, scala, dart, lua, perl, r, objective-c, shell, bash, powershell, sql, solidity, haskell, elixir, erlang, clojure, groovy, fortran, cobol, assembly, visual-basic, matlab, pascal, delphi, f#, julia, zig, nim, ocaml, prolog, common-lisp, scratch]
      example: go
    TechnologyType:
      type: string
      maxLength: 50
      enum: [message-broker, sql-database, nosql-database, cache, search-engine, object-storage, workflow-engine, service-mesh, api-gateway, load-balancer, identity-provider, secret-storage, monitoring, logging, tracing]
      example: sql-database
    TechnologyName:
      type: string
      maxLength: 50
      enum: [postgresql, mysql, mariadb, mongodb, cassandra, clickhouse, redis, memcached, etcd, kafka, rabbitmq, nats, pulsar, elasticsearch, opensearch, s3, minio, ceph, temporal, airflow, argo-workflows, nginx, envoy, kong, traefik, haproxy, prometheus, grafana, zabbix, jaeger, zipkin, opentelemetry, keycloak, vault]
      example: postgresql
    InfrastructureImportancy:
      type: string
      maxLength: 50
      enum: [critical, important, supporting]
      example: critical
    InfrastructureDetails:
      type: object
      required: [technology_name, technology_type, importancy, version, endpoints]
      properties:
        technology_name: {$ref: '#/components/schemas/TechnologyName'}
        version: {type: string, maxLength: 50, example: "17.2"}
        technology_type: {$ref: '#/components/schemas/TechnologyType'}
        importancy: {$ref: '#/components/schemas/InfrastructureImportancy'}
        endpoints:
          type: array
          maxItems: 10
          description: Optional on input. Missing, null, or empty input is returned and stored as []. Order and duplicates are preserved.
          items: {$ref: '#/components/schemas/Name'}
          example: ["postgres-primary.internal:5432", "postgres-replica.internal:5432"]
    InfrastructureDetailsRequest:
      type: object
      required: [technology_name, technology_type, importancy]
      properties:
        technology_name: {$ref: '#/components/schemas/TechnologyName'}
        version: {allOf: [{$ref: '#/components/schemas/Name'}], example: "17.2"}
        technology_type: {$ref: '#/components/schemas/TechnologyType'}
        importancy: {$ref: '#/components/schemas/InfrastructureImportancy'}
        endpoints:
          type: array
          nullable: true
          maxItems: 10
          description: Optional on input. Missing, null, or empty input is returned and stored as []. Order and duplicates are preserved.
          items: {$ref: '#/components/schemas/Name'}
          example: ["postgres-primary.internal:5432", "postgres-replica.internal:5432"]
    ComponentDetails:
      oneOf:
        - {$ref: '#/components/schemas/BackendServiceDetails'}
        - {$ref: '#/components/schemas/FrontendServiceDetails'}
        - {$ref: '#/components/schemas/InfrastructureDetails'}
    ComponentDetailsRequest:
      oneOf:
        - {$ref: '#/components/schemas/BackendServiceDetails'}
        - {$ref: '#/components/schemas/FrontendServiceDetails'}
        - {$ref: '#/components/schemas/InfrastructureDetailsRequest'}
    Component:
      type: object
      required: [id, product_id, name, type, description, details, apis, clients]
      properties:
        id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 3001}
        product_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 2001}
        name: {allOf: [{$ref: '#/components/schemas/Name'}], example: Checkout API}
        type: {$ref: '#/components/schemas/ComponentType'}
        description: {allOf: [{$ref: '#/components/schemas/Description'}], example: Serves checkout requests for the web and mobile apps.}
        details: {$ref: '#/components/schemas/ComponentDetails'}
        apis: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/ComponentAPI'}}
        clients: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/ComponentClientProjection'}}
    CreateComponentRequest:
      type: object
      required: [product_id, name, type, details]
      properties:
        product_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 2001}
        name: {allOf: [{$ref: '#/components/schemas/Name'}], example: Checkout API}
        type: {$ref: '#/components/schemas/ComponentType'}
        description: {allOf: [{$ref: '#/components/schemas/Description'}], example: Serves checkout requests for the web and mobile apps.}
        details: {$ref: '#/components/schemas/ComponentDetailsRequest'}
        apis: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/CreateAPIRequest'}}
        clients: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/CreateClientRequest'}}
    ComponentList:
      type: object
      required: [data, pagination]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Component'}}
        pagination: {$ref: '#/components/schemas/Pagination'}
    APIType:
      type: string
      maxLength: 50
      enum: [rest, graphql, grpc, json-rpc, soap, websocket, odata, sse, event-consumer, topic, subject, exchange, queue, native-protocol, database]
      example: rest
    NetworkExposure: {type: string, maxLength: 50, enum: [internal, internet], example: internet}
    APIName:
      type: string
      minLength: 1
      description: Required API name with up to 20 non-whitespace characters; surrounding whitespace is trimmed.
      pattern: '^(?=\s*\S)(?:\s*\S){1,20}\s*$'
      example: Orders REST
    ComponentAPI:
      type: object
      required: [id, name, api_type, network_exposure]
      properties:
        id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 4001}
        name: {$ref: '#/components/schemas/APIName'}
        api_type: {$ref: '#/components/schemas/APIType'}
        network_exposure: {$ref: '#/components/schemas/NetworkExposure'}
    CreateAPIRequest:
      type: object
      required: [name, api_type, network_exposure]
      additionalProperties: false
      properties:
        name: {$ref: '#/components/schemas/APIName'}
        api_type: {$ref: '#/components/schemas/APIType'}
        network_exposure: {$ref: '#/components/schemas/NetworkExposure'}
    UpdateAPIRequest:
      allOf:
        - {$ref: '#/components/schemas/CreateAPIRequest'}
    ClientName:
      type: string
      maxLength: 50
      enum: [s3-client, rest-client, graphql-client, grpc-client, grpc-streaming-client, json-rpc-client, soap-client, websocket-client, odata-client, sse-client, kafka-client, rabbitmq-client, amqp-client, redpanda-client, nats-client, pulsar-client, sqs-client, gcp-pub-sub-client, azure-service-bus-client, redis-streams-client, activemq-client, ibm-mq-client, native-protocol-client]
      example: rest-client
    ClientAction:
      type: string
      maxLength: 50
      enum: [consume, produce, call, listen-events]
      example: call
    CommunicationType:
      type: string
      maxLength: 50
      enum: [request-response, polling, long-polling, events, stream]
      example: request-response
    ComponentClient:
      type: object
      required: [id, client_name, communication_type, capabilities, secure_connection]
      properties:
        id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 5001}
        client_name: {$ref: '#/components/schemas/ClientName'}
        communication_type: {$ref: '#/components/schemas/CommunicationType'}
        capabilities: {type: string, nullable: true, maxLength: 2097152, example: "read:orders"}
        secure_connection: {type: boolean, example: false}
    ComponentClientProjection:
      allOf:
        - {$ref: '#/components/schemas/ComponentClient'}
        - type: object
          required: [integrations]
          properties:
            integrations: {type: array, items: {$ref: '#/components/schemas/Integration'}}
    CreateClientRequest:
      type: object
      required: [client_name]
      additionalProperties: false
      properties:
        client_name: {$ref: '#/components/schemas/ClientName'}
        capabilities: {type: string, nullable: true, maxLength: 2097152, example: "read:orders"}
        secure_connection: {type: boolean, default: false}
    UpdateClientRequest:
      allOf:
        - {$ref: '#/components/schemas/CreateClientRequest'}
    Integration:
      type: object
      required: [id, client_id, api_id, action, description]
      properties:
        id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 6001}
        client_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 5001}
        api_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 4001}
        action: {$ref: '#/components/schemas/ClientAction'}
        description: {allOf: [{$ref: '#/components/schemas/Description'}], nullable: true, example: Calls the checkout API.}
    CreateIntegrationRequest:
      type: object
      required: [client_id, api_id, action]
      additionalProperties: false
      properties:
        client_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 5001}
        api_id: {allOf: [{$ref: '#/components/schemas/ID'}], example: 4001}
        action: {$ref: '#/components/schemas/ClientAction'}
        description: {allOf: [{$ref: '#/components/schemas/Description'}], nullable: true, example: Calls the checkout API.}
    UpdateIntegrationDescriptionRequest:
      type: object
      required: [description]
      additionalProperties: false
      properties:
        description: {allOf: [{$ref: '#/components/schemas/Description'}], nullable: true, example: Calls checkout with retries.}
